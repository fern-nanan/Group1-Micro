<!-- Tells the browser this is an HTML5 document -->
<!DOCTYPE html>
<!-- Root element of the page; lang="en" tells browsers/screen readers the page is in English -->
<html lang="en">
<head>
<!-- Sets the character encoding so text and symbols display correctly -->
<meta charset="UTF-8">
<!-- Makes the page resize/scale properly on phones and tablets -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Text shown on the browser tab -->
<title>Enterprise Income Tracker</title>
<!-- Bootstrap 5 CDN -->
<!-- Loads Bootstrap's CSS from the internet so we can use its ready-made styles/classes -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<!-- Loads our own custom stylesheet for any extra tweaks -->
<link rel="stylesheet" href="style.css">
</head>
<!-- bg-light = light gray page background, py-5 = padding on top and bottom -->
<body class="bg-light py-5">
<!-- container centers content and adds side margins (Bootstrap layout helper) -->
<main class="container">
<!-- row + justify-content-center: centers the column horizontally -->
<div class="row justify-content-center">
<!-- col-lg-8: on large screens, this column takes up 8 of 12 grid units -->
<div class="col-lg-8">
<!-- Registration Card -->
<!-- card = boxed container with shadow-sm (soft shadow), border-0 (no border), mb-4 (margin below) -->
<div class="card shadow-sm border-0 mb-4">
<!-- Blue header bar for the card, white text, padding top/bottom -->
<div class="card-header bg-primary text-white py-3">
<!-- h5 sized heading, fw-bold makes the text bold -->
<h1 class="h5 mb-0 fw-bold">Income Category Registration</h1>
</div>
<!-- Padded inner area of the card that holds the form -->
<div class="card-body p-4">
<!-- The form that holds our two inputs and the Save button -->
<form id="categoryForm">
<!-- mb-3 adds spacing below this input group -->
<div class="mb-3">
<!-- Label text linked to the txtCatName input via "for" -->
<label for="txtCatName" class="form-label fw-semibold">Category
Name</label>
<!-- Text box where the user types the category name; "required" is a basic HTML check -->
<input type="text" id="txtCatName" class="form-control"
placeholder="e.g., Consulting" required>
</div>
<div class="mb-3">

<!-- Label text linked to the txtCatDesc input -->
<label for="txtCatDesc" class="form-label fw-
semibold">Description</label>

<!-- Text box where the user types the description -->
<input type="text" id="txtCatDesc" class="form-control"
placeholder="e.g., Enterprise technical support contract" required>
</div>

<!-- type="button" (not "submit") so clicking it doesn't reload the page; -->
<!-- JavaScript listens for clicks on this button by its id "btnAdd" -->
<button type="button" id="btnAdd" class="btn btn-primary px-4 fw-
semibold">Save Category</button>

</form>
</div>
</div>
<!-- Ledger Table Card -->

<!-- Second card that displays the list of saved categories -->
<div class="card shadow-sm border-0">
<!-- White header bar for this card -->
<!-- d-flex + justify-content-between: puts the heading on the left and the button on the right -->
<div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
<!-- Small uppercase gray heading -->
<h2 class="h6 mb-0 text-secondary fw-bold text-uppercase">Registered
Categories</h2>
<!-- New button that clears every row in the table at once; -->
<!-- JavaScript listens for clicks on this button by its id "btnDeleteAll" -->
<button type="button" id="btnDeleteAll" class="btn btn-outline-danger btn-sm">
  Delete All
</button>
</div>
<!-- table-responsive lets the table scroll sideways on small screens instead of breaking -->
<div class="table-responsive">
<!-- table-hover highlights a row when you mouse over it; align-middle centers cell content vertically -->
<table class="table table-hover align-middle mb-0">
<!-- table-light gives the header row a light gray background -->
<thead class="table-light">
<tr>
<!-- Column header for the category name; w-35 sets its width to 35% -->
<th scope="col" class="w-35">Category Name</th>
<!-- Column header for the description -->
<th scope="col">Description</th>
<!-- New column header to hold the Delete button for each row -->
<th scope="col" class="text-center">Actions</th>
</tr>
</thead>
<!-- Empty <tbody> with an id; JavaScript inserts new <tr> rows in here -->
<tbody id="listIncomeCat">
<!-- Dynamic rows injected here via JavaScript -->
</tbody>
</table>
</div>
</div>
</div>
</div>
</main>
<!-- Loads our JavaScript file at the end of the body so the HTML above loads first -->
<script src="app.js"></script>
</body>
</html>
